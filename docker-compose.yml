services:
  sweaterr:
    build:
      context: .
      dockerfile: Dockerfile
    image: sweaterr:latest
    container_name: sweaterr
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - FLARESOLVERR_URL=http://192.168.1.100:8191
      - TZ=Europe/Madrid
      # Optional: set JWT_SECRET here as JWT_SECRET=... if you want to manage it manually.
      # If not provided, the server auto-generates and persists one under ./data/.jwt_secret
    volumes:
      # Database persistence (named volume)
      - sweaterr-data:/app/data
      # Prisma schema (named volume, read-only) - persisted for migration safety
      - sweaterr-prisma:/app/prisma:ro
      # Optional: mount entire app for development with live reload
      # - .:/app
      # - /app/node_modules
      # - /app/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Optional: uncomment to enable development with FlareSolverr
    # depends_on:
    #   - flaresolverr

  # Optional: FlareSolverr for Cloudflare bypass (uncomment to use)
  # flaresolverr:
  #   image: flaresolverr/flaresolverr:latest
  #   container_name: flaresolverr
  #   environment:
  #     - LOG_LEVEL=info
  #     - CAPTCHA_SOLVER=hcaptcha-solver
  #   ports:
  #     - "8191:8191"
  #   restart: unless-stopped

  # Optional: Add a reverse proxy (nginx or traefik)
  # nginx:
  #   image: nginx:alpine
  #   container_name: sweaterr-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - sweaterr
  #   restart: unless-stopped

# Persistent volumes
volumes:
  sweaterr-data:
    driver: local
  sweaterr-prisma:
    driver: local
